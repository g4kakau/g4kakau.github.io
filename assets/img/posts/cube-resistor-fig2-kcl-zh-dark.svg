<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title">
  <title id="title">KCL 的節點圖像</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-edge" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <style>
    text {
      font-family: "Noto Sans TC", "Noto Sans CJK TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: #e5e7eb;
    }
    .label { font-size: 22px; font-weight: 700; }
    .small { font-size: 18px; }
    .tiny { font-size: 15px; }
    .math { font-size: 24px; font-weight: 650; }
    .muted { fill: #9aa7b8; }
    .edge { stroke: #cbd5e1; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .thin { stroke: #334155; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dash { stroke-dasharray: 8 8; }
    .panel { fill: #111827; stroke: #334155; stroke-width: 2; }
    .panel2 { fill: #1e293b; stroke: #334155; stroke-width: 2; }
  </style>
  <rect width="960" height="540" fill="#0b1120"/>
<rect x="95" y="75" width="770" height="390" rx="16" class="panel"/>
<g>
    <circle cx="480.0" cy="270.0" r="36" fill="#60a5fa" stroke="#0b1120" stroke-width="4"/>
    <text x="480.0" y="277.0" class="small" text-anchor="middle" style="fill:white">i</text>
  </g>
<path d="M 735 175 L 518 248" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow-edge)"/>
<path d="M 735 365 L 518 292" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow-edge)"/>
<path d="M 442 248 L 225 170" stroke="#9aa7b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="8 8" marker-end="url(#arrow-edge)"/>
<path d="M 462 305 L 350 420" stroke="#9aa7b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="8 8" marker-end="url(#arrow-edge)"/>
<text x="665.0" y="223.0" class="small" text-anchor="middle" style="fill:#9aa7b8">流入</text>
