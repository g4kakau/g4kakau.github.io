<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title">
  <title id="title">Control volume for the continuity equation</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-edge" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/>
    </marker>
  </defs>
  <style>
    text {
      font-family: "Noto Sans TC", "Noto Sans CJK TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: #172033;
    }
    .label { font-size: 22px; font-weight: 700; }
    .small { font-size: 18px; }
    .tiny { font-size: 15px; }
    .math { font-size: 24px; font-weight: 650; }
    .muted { fill: #64748b; }
    .edge { stroke: #334155; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .thin { stroke: #d7dee8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dash { stroke-dasharray: 8 8; }
    .panel { fill: #f8fafc; stroke: #d7dee8; stroke-width: 2; }
    .panel2 { fill: #eef2f7; stroke: #d7dee8; stroke-width: 2; }
  </style>
  <rect width="960" height="540" fill="#ffffff"/>
<rect x="90" y="75" width="780" height="390" rx="16" class="panel"/>
<circle cx="480" cy="270" r="88" fill="#eef2f7" stroke="#2563eb" stroke-width="4" stroke-dasharray="10 8"/>
<path d="M 180 210 C 270 210, 330 235, 398 252" stroke="#334155" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow-edge)"/>
<path d="M 780 190 C 675 195, 620 230, 560 252" stroke="#334155" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow-edge)"/>
<path d="M 355 420 C 395 355, 425 325, 452 300" stroke="#334155" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow-edge)"/>
<path d="M 515 238 C 585 190, 650 150, 760 125" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="8 8" marker-end="url(#arrow-edge)"/>
<path d="M 520 300 C 590 350, 660 385, 780 405" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="8 8" marker-end="url(#arrow-edge)"/>
<text x="480.0" y="274.0" class="small" text-anchor="middle">node region</text>
<text x="480.0" y="440.0" class="math" text-anchor="middle" style="fill:#2563eb">∂ρ/∂t + ∇·J = 0</text>
<text x="480.0" y="125.0" class="small" text-anchor="middle" style="fill:#64748b">steady state: ∂ρ/∂t = 0</text>
</svg>
