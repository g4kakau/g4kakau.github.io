<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title">
  <title id="title">The symmetry-reduced circuit</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-edge" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/>
    </marker>
  </defs>
  <style>
    text {
      font-family: "Noto Sans TC", "Noto Sans CJK TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: #172033;
    }
    .label { font-size: 22px; font-weight: 700; }
    .small { font-size: 18px; }
    .tiny { font-size: 15px; }
    .math { font-size: 24px; font-weight: 650; }
    .muted { fill: #64748b; }
    .edge { stroke: #334155; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .thin { stroke: #d7dee8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dash { stroke-dasharray: 8 8; }
    .panel { fill: #f8fafc; stroke: #d7dee8; stroke-width: 2; }
    .panel2 { fill: #eef2f7; stroke: #d7dee8; stroke-width: 2; }
  </style>
  <rect width="960" height="540" fill="#ffffff"/>
<rect x="70" y="90" width="820" height="350" rx="16" class="panel"/>
<line x1="150" y1="270" x2="360" y2="270" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
<text x="255.0" y="240.0" class="small" text-anchor="middle" style="fill:#64748b">3 edges</text>
<line x1="360" y1="270" x2="600" y2="270" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
<text x="480.0" y="240.0" class="small" text-anchor="middle" style="fill:#64748b">6 edges</text>
<line x1="600" y1="270" x2="810" y2="270" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
<text x="705.0" y="240.0" class="small" text-anchor="middle" style="fill:#64748b">3 edges</text>
<g>
    <circle cx="150.0" cy="270.0" r="30" fill="#475569" stroke="#ffffff" stroke-width="4"/>
    <text x="150.0" y="277.0" class="small" text-anchor="middle" style="fill:white">A</text>
  </g>
<g>
    <circle cx="360.0" cy="270.0" r="30" fill="#2563eb" stroke="#ffffff" stroke-width="4"/>
    <text x="360.0" y="277.0" class="small" text-anchor="middle" style="fill:white">B</text>
  </g>
<g>
    <circle cx="600.0" cy="270.0" r="30" fill="#0f766e" stroke="#ffffff" stroke-width="4"/>
    <text x="600.0" y="277.0" class="small" text-anchor="middle" style="fill:white">C</text>
  </g>
<g>
    <circle cx="810.0" cy="270.0" r="30" fill="#6d28d9" stroke="#ffffff" stroke-width="4"/>
    <text x="810.0" y="277.0" class="small" text-anchor="middle" style="fill:white">H</text>
  </g>
<text x="255.0" y="338.0" class="math" text-anchor="middle" style="fill:#2563eb">R/3</text>
<text x="480.0" y="338.0" class="math" text-anchor="middle" style="fill:#2563eb">R/6</text>
<text x="705.0" y="338.0" class="math" text-anchor="middle" style="fill:#2563eb">R/3</text>
<text x="480.0" y="405.0" class="small" text-anchor="middle" style="fill:#64748b">Each orbit becomes one representative node</text>
</svg>
