<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title">
  <title id="title">S₃ is not commutative</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-edge" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <style>
    text {
      font-family: "Noto Sans TC", "Noto Sans CJK TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: #e5e7eb;
    }
    .label { font-size: 22px; font-weight: 700; }
    .small { font-size: 18px; }
    .tiny { font-size: 15px; }
    .math { font-size: 24px; font-weight: 650; }
    .muted { fill: #9aa7b8; }
    .edge { stroke: #cbd5e1; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .thin { stroke: #334155; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dash { stroke-dasharray: 8 8; }
    .panel { fill: #111827; stroke: #334155; stroke-width: 2; }
    .panel2 { fill: #1e293b; stroke: #334155; stroke-width: 2; }
  </style>
  <rect width="960" height="540" fill="#0b1120"/>
<rect x="75" y="85" width="810" height="370" rx="16" class="panel"/>
<text x="190.0" y="185.0" class="small" text-anchor="middle">(12) then (13)</text>
<path d="M 315 177 H 405" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/>
<text x="505.0" y="185.0" class="small" text-anchor="middle" style="fill:#9aa7b8">1→3, 3→2, 2→1</text>
<path d="M 615 177 H 705" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/>
<text x="770.0" y="185.0" class="math" text-anchor="middle" style="fill:#f59e0b">(132)</text>
<text x="190.0" y="325.0" class="small" text-anchor="middle">(13) then (12)</text>
<path d="M 315 317 H 405" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/>
<text x="505.0" y="325.0" class="small" text-anchor="middle" style="fill:#9aa7b8">1→2, 2→3, 3→1</text>
<path d="M 615 317 H 705" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/>
<text x="770.0" y="325.0" class="math" text-anchor="middle" style="fill:#f59e0b">(123)</text>
<text x="480.0" y="420.0" class="math" text-anchor="middle" style="fill:#f87171">(12)(13) ≠ (13)(12)</text>
</svg>
