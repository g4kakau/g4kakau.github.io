<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title">
  <title id="title">Potential ladder</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-edge" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <style>
    text {
      font-family: "Noto Sans TC", "Noto Sans CJK TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: #e5e7eb;
    }
    .label { font-size: 22px; font-weight: 700; }
    .small { font-size: 18px; }
    .tiny { font-size: 15px; }
    .math { font-size: 24px; font-weight: 650; }
    .muted { fill: #9aa7b8; }
    .edge { stroke: #cbd5e1; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .thin { stroke: #334155; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dash { stroke-dasharray: 8 8; }
    .panel { fill: #111827; stroke: #334155; stroke-width: 2; }
    .panel2 { fill: #1e293b; stroke: #334155; stroke-width: 2; }
  </style>
  <rect width="960" height="540" fill="#0b1120"/>
<rect x="90" y="70" width="780" height="400" rx="16" class="panel"/>
<line x1="220" y1="155" x2="220" y2="425" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
<g>
    <circle cx="220.0" cy="155.0" r="24" fill="#64748b" stroke="#0b1120" stroke-width="4"/>
    <text x="220.0" y="162.0" class="small" text-anchor="middle" style="fill:white">A</text>
  </g>
<text x="280.0" y="163.0" class="math" text-anchor="start">V(A) = 1</text>
<g>
    <circle cx="220.0" cy="260.0" r="24" fill="#60a5fa" stroke="#0b1120" stroke-width="4"/>
    <text x="220.0" y="267.0" class="small" text-anchor="middle" style="fill:white">B</text>
  </g>
<text x="280.0" y="268.0" class="math" text-anchor="start">V(B) = 3/5</text>
<g>
    <circle cx="220.0" cy="320.0" r="24" fill="#34d399" stroke="#0b1120" stroke-width="4"/>
    <text x="220.0" y="327.0" class="small" text-anchor="middle" style="fill:white">C</text>
  </g>
<text x="280.0" y="328.0" class="math" text-anchor="start">V(C) = 2/5</text>
<g>
    <circle cx="220.0" cy="425.0" r="24" fill="#a78bfa" stroke="#0b1120" stroke-width="4"/>
    <text x="220.0" y="432.0" class="small" text-anchor="middle" style="fill:white">H</text>
  </g>
<text x="280.0" y="433.0" class="math" text-anchor="start">V(H) = 0</text>
<path d="M 500 155 V 250" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow2)"/>
<path d="M 500 260 V 310" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow2)"/>
<path d="M 500 320 V 415" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow2)"/>
<g>
    <rect x="552" y="181" width="116" height="40" rx="10" fill="#0b1120" stroke="#334155" stroke-width="2"/>
    <text x="610.0" y="210.0" class="small" text-anchor="middle" style="fill:#e5e7eb">ΔV=2/5</text>
  </g>
<g>
    <rect x="552" y="268" width="116" height="40" rx="10" fill="#0b1120" stroke="#334155" stroke-width="2"/>
    <text x="610.0" y="297.0" class="small" text-anchor="middle" style="fill:#e5e7eb">ΔV=1/5</text>
  </g>
<g>
    <rect x="552" y="346" width="116" height="40" rx="10" fill="#0b1120" stroke="#334155" stroke-width="2"/>
    <text x="610.0" y="375.0" class="small" text-anchor="middle" style="fill:#e5e7eb">ΔV=2/5</text>
  </g>
<text x="705.0" y="292.0" class="small" text-anchor="start" style="fill:#9aa7b8">smaller middle drop</text>
</svg>
