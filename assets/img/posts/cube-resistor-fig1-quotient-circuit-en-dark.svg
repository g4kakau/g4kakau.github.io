<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title">
  <title id="title">The symmetry-reduced circuit</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-edge" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <style>
    text {
      font-family: "Noto Sans TC", "Noto Sans CJK TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: #e5e7eb;
    }
    .label { font-size: 22px; font-weight: 700; }
    .small { font-size: 18px; }
    .tiny { font-size: 15px; }
    .math { font-size: 24px; font-weight: 650; }
    .muted { fill: #9aa7b8; }
    .edge { stroke: #cbd5e1; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .thin { stroke: #334155; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .dash { stroke-dasharray: 8 8; }
    .panel { fill: #111827; stroke: #334155; stroke-width: 2; }
    .panel2 { fill: #1e293b; stroke: #334155; stroke-width: 2; }
  </style>
  <rect width="960" height="540" fill="#0b1120"/>
<rect x="70" y="90" width="820" height="350" rx="16" class="panel"/>
<line x1="150" y1="270" x2="360" y2="270" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
<text x="255.0" y="240.0" class="small" text-anchor="middle" style="fill:#9aa7b8">3 edges</text>
<line x1="360" y1="270" x2="600" y2="270" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
<text x="480.0" y="240.0" class="small" text-anchor="middle" style="fill:#9aa7b8">6 edges</text>
<line x1="600" y1="270" x2="810" y2="270" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
<text x="705.0" y="240.0" class="small" text-anchor="middle" style="fill:#9aa7b8">3 edges</text>
<g>
    <circle cx="150.0" cy="270.0" r="30" fill="#64748b" stroke="#0b1120" stroke-width="4"/>
    <text x="150.0" y="277.0" class="small" text-anchor="middle" style="fill:white">A</text>
  </g>
<g>
    <circle cx="360.0" cy="270.0" r="30" fill="#60a5fa" stroke="#0b1120" stroke-width="4"/>
    <text x="360.0" y="277.0" class="small" text-anchor="middle" style="fill:white">B</text>
  </g>
<g>
    <circle cx="600.0" cy="270.0" r="30" fill="#34d399" stroke="#0b1120" stroke-width="4"/>
    <text x="600.0" y="277.0" class="small" text-anchor="middle" style="fill:white">C</text>
  </g>
<g>
    <circle cx="810.0" cy="270.0" r="30" fill="#a78bfa" stroke="#0b1120" stroke-width="4"/>
    <text x="810.0" y="277.0" class="small" text-anchor="middle" style="fill:white">H</text>
  </g>
<text x="255.0" y="338.0" class="math" text-anchor="middle" style="fill:#60a5fa">R/3</text>
<text x="480.0" y="338.0" class="math" text-anchor="middle" style="fill:#60a5fa">R/6</text>
<text x="705.0" y="338.0" class="math" text-anchor="middle" style="fill:#60a5fa">R/3</text>
<text x="480.0" y="405.0" class="small" text-anchor="middle" style="fill:#9aa7b8">Each orbit becomes one representative node</text>
</svg>
