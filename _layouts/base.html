<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-Hant-TW' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      line-height: 1.7;
      color: #222;
      background: #fff;
    }
    nav {
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }
    nav a { margin-right: 1rem; text-decoration: none; color: #0066cc; }
    nav a:hover { text-decoration: underline; }
    hr { border: none; border-top: 1px solid #ddd; margin: 1rem 0; }
    h1 { font-size: 1.8rem; margin-top: 1.5rem; }
    h2 { font-size: 1.3rem; margin-top: 2rem; border-bottom: 1px solid #eee; padding-bottom: 0.3rem; }
    h3 { font-size: 1.1rem; margin-top: 1.5rem; }
    p, li { font-size: 1rem; }
    a { color: #0066cc; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ddd; padding: 0.5rem 0.75rem; text-align: left; }
    th { background: #f5f5f5; }
    code { background: #f4f4f4; padding: 0.15em 0.4em; border-radius: 3px; font-size: 0.92em; }
    blockquote { border-left: 4px solid #ddd; margin: 1rem 0; padding: 0.5rem 1rem; color: #555; }
    .cta-box {
      border: 1px solid #0066cc;
      border-radius: 6px;
      padding: 1rem 1.5rem;
      margin: 2rem 0;
      background: #f0f7ff;
    }
  </style>

  <!-- MathJax v3 -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        tags: 'ams'
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
</head>

<body>
  <nav>
    <a href="{{ '/' | relative_url }}">首頁</a>
    <a href="{{ '/notes/math.html' | relative_url }}">數學</a>
    <a href="{{ '/notes/physics.html' | relative_url }}">物理</a>
    <a href="{{ '/tutoring_plans.html' | relative_url }}">家教方案</a>
    <a href="{{ '/contact.html' | relative_url }}">聯絡</a>
  </nav>
  <hr>

  <main>
    {{ content }}
  </main>

  <hr>
  <footer style="font-size:0.85rem; color:#888; margin-top:1rem;">
    © {{ site.time | date: "%Y" }} {{ site.title }}
  </footer>
</body>
</html>
