---
layout: base
---

<article>
  <h1>{{ page.title }}</h1>
  <p style="color:#888; font-size:0.9rem;">
    {{ page.date | date: "%Y-%m-%d" }}
    {% if page.categories %}
      &nbsp;·&nbsp;
      {% for cat in page.categories %}
        <a href="{{ '/notes/' | append: cat | append: '.html' | relative_url }}" style="color:#888;">{{ cat }}</a>{% unless forloop.last %}, {% endunless %}
      {% endfor %}
    {% endif %}
  </p>

  {{ content }}

  <hr>
  <p><a href="{{ '/' | relative_url }}">← 回首頁</a></p>
</article>
